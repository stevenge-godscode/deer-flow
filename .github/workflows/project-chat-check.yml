name: Project chat frontend checks
on:
  push:
    branches: [codex/native-project-agent-chat]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-chat-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'stevenge-godscode/deer-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.26.2 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec next typegen && pnpm check
        working-directory: frontend
      - run: pnpm exec rstest run --pool.maxWorkers 2 --pool.minWorkers 1
        working-directory: frontend
